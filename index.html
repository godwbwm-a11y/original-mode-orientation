<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#090b17" />
    <meta name="description" content="성 카를로 아쿠티스와 함께 걷는 7일 묵상 웹게임의 오리엔테이션" />
    <title>ORIGINAL MODE — 0. 오리엔테이션</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  </head>
  <body>
    <main id="app" aria-label="ORIGINAL MODE 오리엔테이션 게임">
      <div id="game-root" aria-hidden="true"></div>

      <header id="hud" class="is-hidden" aria-live="polite">
        <div class="hud-brand">ORIGINAL MODE</div>
        <div class="hud-copy">
          <strong id="hud-title">오리엔테이션</strong>
          <span id="hud-objective">천천히 시작해 보세요.</span>
        </div>
        <button id="menu-button" class="icon-button" type="button" aria-label="메뉴 열기">☰</button>
      </header>

      <section id="story-card" class="panel is-hidden" role="dialog" aria-modal="true" aria-labelledby="story-title">
        <p id="story-kicker" class="kicker"></p>
        <h1 id="story-title"></h1>
        <div id="story-body" class="story-body"></div>
        <div id="story-actions" class="actions"></div>
      </section>

      <section id="choice-card" class="panel is-hidden" role="dialog" aria-modal="true" aria-labelledby="choice-title">
        <p id="choice-kicker" class="kicker"></p>
        <h2 id="choice-title"></h2>
        <p id="choice-help" class="panel-help"></p>
        <div id="choice-list" class="choice-grid"></div>
      </section>

      <section id="input-card" class="panel is-hidden" role="dialog" aria-modal="true" aria-labelledby="input-title">
        <p id="input-kicker" class="kicker"></p>
        <h2 id="input-title"></h2>
        <p id="input-help" class="panel-help"></p>
        <label class="input-wrap">
          <span id="input-label">내 생각</span>
          <textarea id="reflection-input" maxlength="120" rows="3" placeholder="짧게 적어도 괜찮아요."></textarea>
        </label>
        <div id="input-actions" class="actions"></div>
      </section>

      <section id="avatar-card" class="panel is-hidden" role="dialog" aria-modal="true" aria-labelledby="avatar-title">
        <p class="kicker">나답게 시작하기</p>
        <h2 id="avatar-title">나만의 캐릭터 만들기</h2>
        <p class="panel-help">마음에 드는 모습을 골라 보세요. 정답은 없어요.</p>
        <div class="avatar-layout">
          <div id="avatar-preview" class="avatar-preview" aria-label="선택한 캐릭터 미리 보기">
            <span class="avatar-hair"></span><span class="avatar-face"></span><span class="avatar-shirt"></span><span class="avatar-pants"></span>
          </div>
          <div class="avatar-options">
            <fieldset><legend>피부색</legend><div id="skin-options" class="swatches"></div></fieldset>
            <fieldset><legend>머리색</legend><div id="hair-options" class="swatches"></div></fieldset>
            <fieldset><legend>상의</legend><div id="shirt-options" class="swatches"></div></fieldset>
          </div>
        </div>
        <div class="actions"><button id="avatar-confirm" class="primary-button" type="button">이 모습으로 시작</button></div>
      </section>

      <nav id="mobile-controls" class="controls is-hidden" aria-label="게임 조작">
        <div class="move-controls">
          <button class="control-button" data-control="left" type="button" aria-label="왼쪽으로 이동">◀</button>
          <button class="control-button" data-control="right" type="button" aria-label="오른쪽으로 이동">▶</button>
        </div>
        <div class="action-controls">
          <button class="control-button jump-button" data-control="jump" type="button">점프</button>
          <button id="interact-button" class="control-button interact-button" data-control="interact" type="button">살펴보기</button>
        </div>
      </nav>

      <div id="toast" class="toast is-hidden" role="status" aria-live="polite"></div>

      <section id="menu-card" class="panel compact-panel is-hidden" role="dialog" aria-modal="true" aria-labelledby="menu-title">
        <h2 id="menu-title">잠시 쉬어가기</h2>
        <p class="panel-help">진행 내용은 이 기기에 자동으로 저장돼요.</p>
        <div class="stacked-actions">
          <button id="resume-button" class="primary-button" type="button">계속하기</button>
          <button id="restart-button" class="secondary-button danger-button" type="button">처음부터 다시 시작</button>
        </div>
      </section>

      <section id="adoration-card" class="adoration-card is-hidden" role="dialog" aria-modal="true" aria-labelledby="adoration-title">
        <div class="adoration-copy">
          <p class="kicker">우리 성당 감실을 바라보며</p>
          <h1 id="adoration-title">예수님과 함께 머무는 시간</h1>
          <p id="adoration-guide">성체 안에 계신 예수님께 마음으로 이야기해 보세요.</p>
        </div>
        <img src="assets/church-tabernacle.jpg" alt="우리 성당의 감실" />
        <div class="adoration-timer" aria-live="polite"><strong id="adoration-seconds">10</strong><span>초</span></div>
        <div class="adoration-progress"><span id="adoration-progress-bar"></span></div>
      </section>

      <section id="rotate-card" aria-live="polite">
        <div class="phone-turn" aria-hidden="true">▯</div>
        <h1>휴대전화를 세로로 세워주세요</h1>
        <p>세로 화면에서 게임을 더 편하게 즐길 수 있어요.</p>
      </section>

      <div id="loading-card">
        <div class="loading-mark">원본</div>
        <p>게임을 준비하고 있어요…</p>
      </div>
    </main>
    <noscript>이 게임을 플레이하려면 브라우저에서 자바스크립트를 켜 주세요.</noscript>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
